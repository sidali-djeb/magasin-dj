async function loadAll(role) {
  const rows = async q => (await must(q)) || [];
  const prodQ = role === 'client' ? sb.from('storefront_products').select('*').order('name') : sb.from('products').select('*').eq('active', true).order('name');
  const [prods, sups, cls, sales, pos, vs, rl, vars, staff, mvs] = await Promise.all([
    rows(prodQ),
    rows(sb.from('suppliers').select('*').order('name')),
    rows(sb.from('clients').select('*').order('name')),
    rows(sb.from('sales').select('*, sale_items(*)').order('created_at', { ascending: false }).limit(1000)),
    rows(sb.from('purchase_orders').select('*, purchase_order_items(*)').order('created_at', { ascending: false })),
    rows(sb.from('vouchers').select('*').order('created_at', { ascending: false })),
    rows(sb.from('loyalty_rules').select('*').eq('id', 1)),
    rows(role === 'client' ? sb.from('storefront_variants').select('*') : sb.from('product_variants').select('*').eq('active', true).order('created_at')),
    role === 'admin' ? (async () => { const r = await sb.rpc('admin_list_users'); return r.data || []; })() : Promise.resolve([]),
    role === 'admin' ? (async () => { return (await sb.from('stock_movements').select('variant_id,product_id,delta,ref_id,created_at').eq('reason', 'purchase_receipt').order('created_at', { ascending: true }).limit(2000)).data || []; })() : Promise.resolve([]),
  ]);
  const rcMap = new Map();
  mvs.forEach(m => { const k = m.ref_id + '|' + m.created_at; if (!rcMap.has(k)) rcMap.set(k, { id: k, poId: m.ref_id, at: m.created_at, lines: [] }); rcMap.get(k).lines.push({ vid: m.variant_id, pid: m.product_id, qty: m.delta }); });
  const receipts = [...rcMap.values()].map((r, i) => ({ ...r, no: 'BR-' + String(i + 1).padStart(4, '0') })).reverse();
  const staffName = Object.fromEntries(staff.map(u => [u.id, u.full_name || (u.email || '').split('@')[0]]));
  const pPrice = Object.fromEntries(prods.map(x => [x.id, Number(x.price)]));
  const byP = {};
  vars.forEach(v => { (byP[v.product_id] = byP[v.product_id] || []).push({ id: v.id, pid: v.product_id, color: v.color || '', size: v.size || '', sku: v.sku || '', priceOverride: role === 'client' || v.price === null ? null : Number(v.price), price: v.price === null || v.price === undefined ? pPrice[v.product_id] : Number(v.price), stock: v.stock }); });
  const sizeIdx = z => { const i = SIZE_ORDER.indexOf(z); return i < 0 ? 999 : i; };
  Object.values(byP).forEach(list => list.sort((a, b) => (a.color || '').localeCompare(b.color || '') || sizeIdx(a.size) - sizeIdx(b.size)));
  const uniqJoin = (list, k) => [...new Set((list || []).map(v => v[k]).filter(Boolean))].join(', ');
  const clients = cls.map(c => ({ id: c.id, name: c.name, email: c.email || '', phone: c.phone || '', address: c.address || '', wilaya: c.wilaya || '', commune: c.commune || '', earned: c.points_earned_total, pts: c.points_balance, spend: Number(c.total_spent) }));
  const cname = Object.fromEntries(clients.map(c => [c.id, c.name]));
  const r = rl[0];
  return {
    products: prods.map(p => ({ id: p.id, sku: p.sku, name: p.name, ar: p.name_ar || p.name, cat: CAT_FROM[p.category] || 'Accessoires', price: Number(p.price), cost: Number(p.cost || 0), stock: p.stock, reorder: p.reorder_level, sup: p.supplier_id, fabric: p.fabric || '', color: uniqJoin(byP[p.id], 'color'), sizes: uniqJoin(byP[p.id], 'size'), variants: byP[p.id] || [], emoji: p.emoji || '🏷️', img: p.image_url || '', bg: bgOf(p.sku) })),
    suppliers: sups.map(x => ({ id: x.id, name: x.name, contact: x.contact_name || '', email: x.email || '', city: x.city || '', leadDays: x.lead_days, rating: Number(x.rating || 0) })),
    clients,
    receipts,
    staff: staff.filter(u => u.role === 'admin' || u.role === 'vendeur').map(u => ({ id: u.id, name: staffName[u.id], role: u.role })),
    sales: sales.map(x => ({
      id: x.id, ref: x.ref, date: x.created_at.slice(0, 10), channel: x.channel === 'web' ? 'Web' : 'POS', clientId: x.client_id,
      clientName: cname[x.client_id] || 'Client de passage',
      sellerId: x.channel === 'pos' ? x.seller_id : null, sellerName: x.channel === 'pos' ? (staffName[x.seller_id] || '') : '',
      lines: (x.sale_items || []).map(i => ({ pid: i.product_id, vid: i.variant_id, name: i.name, ar: i.name_ar || i.name, qty: i.qty, price: Number(i.unit_price) })),
      subtotal: Number(x.subtotal), tierDisc: Number(x.tier_discount), voucherDisc: Number(x.voucher_discount), voucher: x.voucher_code,
      pointsUsed: x.points_used, pointsDisc: Number(x.points_discount), pointsEarned: x.points_earned, total: Number(x.total), tier: cap(x.tier),
    })),
    purchases: pos.map(x => ({
      id: x.id, ref: x.ref, supplierId: x.supplier_id, date: x.created_at.slice(0, 10), expected: x.expected_date || '—', status: PO_FROM[x.status],
      lines: (x.purchase_order_items || []).map(i => ({ id: i.id, pid: i.product_id, vid: i.variant_id, qty: i.qty, received: i.received_qty, cost: Number(i.unit_cost) })),
    })),
    vouchers: vs.map(v => ({ id: v.id, code: v.code, kind: v.kind, type: v.discount_type, value: Number(v.value), minTotal: Number(v.min_total), expires: v.expires_at, limit: v.usage_limit, used: v.used_count, active: v.active })),
    rules: r ? { perDA: r.points_per_da, redeemValue: Number(r.redeem_value), tiers: { Silver: r.silver_threshold, Gold: r.gold_threshold }, mult: { Bronze: 1, Silver: Number(r.mult_silver), Gold: Number(r.mult_gold) }, disc: { Bronze: 0, Silver: Number(r.disc_silver), Gold: Number(r.disc_gold) } } : DEFAULT_RULES,
  };
}

/* Photos produits (Supabase Storage, compressées avant envoi) */
async function shrinkImage(file, max = 900) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  if (!blob) throw new Error('Image illisible');
  return blob;
}
async function uploadProductImage(file, pid) {
  if (!/^image\//.test(file.type)) throw new Error('Choisissez un fichier image');
  const blob = await shrinkImage(file);
  const path = `${pid}/${Date.now()}.jpg`;
  const up = await sb.storage.from('magasin-products').upload(path, blob, { contentType: 'image/jpeg' });
  if (up.error) throw up.error;
  const { data } = sb.storage.from('magasin-products').getPublicUrl(path);
  await must(sb.from('products').update({ image_url: data.publicUrl }).eq('id', pid));
}

    <label title={t('Changer la photo', 'تغيير الصورة')} className={`relative block ${size} shrink-0 cursor-pointer overflow-hidden rounded-lg ring-1 ring-zinc-200 hover:ring-zinc-900`}>
      <Thumb p={p} cls={size} txt={txt} />
      <span className="absolute inset-x-0 bottom-0 bg-black/55 text-center text-[9px] leading-4 text-white">📷</span>
      <input type="file" accept="image/*" className="hidden" onChange={e => { const f = e.target.files[0]; e.target.value = ''; if (f) act(() => uploadProductImage(f, p.id), t('Photo enregistrée', 'تم حفظ الصورة')); }} />

}

/* Champ numérique : n'envoie la valeur au serveur qu'à la validation (Entrée / perte de focus) */
function NumInput({ value, onCommit, min = 0, className = '' }) {
  const [v, setV] = useState(String(value));
  const ref = useRef(value); ref.current = value;
  useEffect(() => { setV(String(value)); }, [value]);
  const commit = () => {
    const n = Math.max(min, Math.floor(Number(v) || 0));
    if (n === Number(value)) { setV(String(value)); return; }
    Promise.resolve(onCommit(n)).then(() => setV(String(ref.current)));
  };
  return <input type="number" min={min} value={v} onChange={e => setV(e.target.value)} onBlur={commit} onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} className={className} />;
}

/* Calcul d'un panier : remises palier, bon, points, total, points gagnés */
function checkVoucher(code, vouchers, subtotal, t) {
  if (!code) return null;
  const v = vouchers.find(x => x.code === code.trim().toUpperCase());
  if (!v) return { error: t('Code introuvable', 'الرمز غير موجود') };
  if (!v.active) return { error: t('Bon désactivé', 'القسيمة معطلة') };
  if (v.expires < today()) return { error: t('Bon expiré', 'القسيمة منتهية الصلاحية') };
  if (v.used >= v.limit) return { error: t("Limite d'utilisation atteinte", 'تم بلوغ حد الاستخدام') };
  if (subtotal < v.minTotal) return { error: t(`Minimum ${fmtNum(v.minTotal)} DA requis`, `الحد الأدنى ${fmtNum(v.minTotal)} د.ج`) };
  const disc = v.type === 'percent' ? Math.round(subtotal * v.value / 100) : Math.min(v.value, subtotal);
  return { v, disc };
}

function quoteSale(db, { cart, clientId, code, usePts }, t) {
  const lines = cart.map(l => { const p = db.products.find(x => x.id === l.pid); const v = p && p.variants.find(x => x.id === l.vid); if (!v) return null; const fr = vLabel(v, 'fr'), ar = vLabel(v, 'ar'); return { pid: p.id, vid: v.id, name: p.name + (fr ? ` (${fr})` : ''), ar: p.ar + (ar ? ` (${ar})` : ''), qty: l.qty, price: (l.price !== undefined && l.price !== null && l.price !== '' && +l.price >= 0) ? Math.round(+l.price) : v.price, stock: v.stock }; }).filter(Boolean);
  const subtotal = lines.reduce((s, l) => s + l.price * l.qty, 0);
  const client = db.clients.find(c => c.id === clientId) || null;
  const vr = code ? checkVoucher(code, db.vouchers, subtotal, t) : null;
  const r = db.rules;
  const tier = client ? tierOf(client.earned, r) : 'Bronze';
  const voucherDisc = vr && vr.disc ? vr.disc : 0;
  const tierDisc = Math.round((subtotal - voucherDisc) * r.disc[tier] / 100);
  const afterDisc = Math.max(0, subtotal - voucherDisc - tierDisc);
  const pointsUsed = client ? Math.max(0, Math.min(Math.floor(usePts || 0), client.pts, Math.floor(afterDisc / r.redeemValue))) : 0;
  const pointsDisc = pointsUsed * r.redeemValue;
  const total = Math.max(0, afterDisc - pointsDisc);
  const pointsEarned = client ? Math.floor(Math.floor(total / r.perDA) * r.mult[tier]) : 0;
  const stockErr = lines.find(l => l.qty > l.stock) || null;
  return { lines, subtotal, client, tier, vr, voucherDisc, tierDisc, pointsUsed, pointsDisc, total, pointsEarned, stockErr, error: vr && vr.error ? vr.error : null };
}

  const days = [...Array(7)].map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));

    <div>
      <PageTitle title={t('Tableau de bord', 'لوحة القيادة')} sub={t("Vue d'ensemble du magasin et du site web", 'نظرة عامة على المتجر والموقع')} />

        <Kpi label={t("Chiffre d'affaires", 'رقم المعاملات')} value={money(revenue)} icon="chart" tone="green" hint={`${t('Web', 'ويب')} ${webShare}%`} />
        <Kpi label={t('Valeur du stock', 'قيمة المخزون')} value={money(stockValue)} icon="box" tone="blue" hint={`${db.products.length} ${t('références', 'مرجعاً')}`} />
        <Kpi label={t('Points fidélité actifs', 'نقاط الولاء النشطة')} value={fmtNum(activePts)} icon="star" tone="violet" hint={`${db.clients.length} ${t('clients', 'زبائن')}`} />
        <Kpi label={t("Bons d'achat utilisés", 'قسائم مستعملة')} value={redeemed} icon="gift" tone="amber" hint={`${db.vouchers.filter(v => v.active).length} ${t('actifs', 'نشطة')}`} />
      </div>
      <div className="mt-4 grid gap-4 xl:grid-cols-3">
        <Card className="p-5 xl:col-span-2">
          <div className="mb-4 flex items-center justify-between"><h2 className="font-semibold">{t('Ventes des 7 derniers jours', 'مبيعات آخر 7 أيام')}</h2><Badge>{money(days.reduce((a, d) => a + d.v, 0))}</Badge></div>
          <BarChart data={days} />
        </Card>
        <Card className="p-5">
          <h2 className="mb-4 font-semibold">{t('Valeur du stock par catégorie', 'قيمة المخزون حسب الفئة')}</h2>
          <div className="space-y-3">
            {byCat.map(x => (
              <div key={x.c}>
                <div className="mb-1 flex justify-between text-sm"><span>{lang === 'ar' ? CAT_AR[x.c] : x.c}</span><span className="tabular text-zinc-500">{money(x.v)}</span></div>
                <div className="h-2 rounded-full bg-zinc-100"><div className="h-2 rounded-full bg-zinc-900 transition-all duration-700" style={{ width: `${(x.v / maxCat) * 100}%` }} /></div>
              </div>
            ))}
          </div>
        </Card>
        <Card className="p-5">
          <h2 className="mb-3 font-semibold">{t('Produits les plus vendus', 'الأكثر مبيعاً')}</h2>
          <ol className="space-y-2.5">
            {top.map((x, i) => <li key={x.p.id} className="flex items-center gap-3 text-sm"><span className="grid h-6 w-6 place-items-center rounded-full bg-zinc-100 text-xs font-semibold">{i + 1}</span><span className="text-lg">{x.p.emoji}</span><span className="truncate">{pn(x.p)}</span><span className="tabular ms-auto text-zinc-500">{x.q} {t('vendus', 'مباعة')}</span></li>)}

        </Card>
      </div>

                  {p.variants.map(v => { const c = v.color ? parseColor(v.color) : null; return (
                    <div key={v.id} className="flex items-center gap-1.5 rounded-lg bg-zinc-50 px-1.5 py-1 text-xs">
                      {c && <span className="inline-block h-3 w-3 shrink-0 rounded-full border border-zinc-300" style={dotStyle(c.hex)} />}

                      {readonly ? <span className="tabular font-semibold">{v.stock}</span> : <NumInput value={v.stock} onCommit={n => setStock(v.id, n)} className="tabular w-14 rounded-md border border-zinc-200 bg-white px-1 py-0.5 text-center text-xs outline-none focus:ring-2 focus:ring-zinc-900/10" />}
                    </div>); })}

              {!readonly && <div className="mt-2 flex gap-1 border-t border-zinc-100 pt-2">
                <button onClick={() => setEditing(p)} title={t('Modifier', 'تعديل')} className="flex flex-1 justify-center rounded-lg border border-zinc-200 p-1.5 text-zinc-600 hover:bg-zinc-100"><Icon n="edit" s={14} /></button>
                <button onClick={() => dupProduct(p)} title={t('Dupliquer', 'نسخ')} className="flex flex-1 justify-center rounded-lg border border-zinc-200 p-1.5 text-zinc-600 hover:bg-zinc-100"><Icon n="copy" s={14} /></button>
                <button onClick={() => delProduct(p)} title={t('Supprimer', 'حذف')} className="flex flex-1 justify-center rounded-lg border border-zinc-200 p-1.5 text-rose-600 hover:bg-rose-50"><Icon n="trash" s={14} /></button>
              </div>}

          ))}
        </div>
        {rows.length === 0 && <div className="p-8 text-center text-sm text-zinc-500">{t('Aucun produit', 'لا توجد منتجات')}</div>}
      </Card>
      {adding && <AddProductModal onClose={() => setAdding(false)} />}

  );

function ReceiveModal({ po, onClose }) {
  const { db, act, toast, t, pn, lang } = useApp();
  const [q, setQ] = useState(() => po.lines.map(l => l.qty - l.received));
  const confirm = async () => {
    const items = po.lines.map((l, i) => ({ item_id: l.id, qty: Math.min(l.qty - l.received, Math.max(0, Math.floor(Number(q[i]) || 0))) })).filter(x => x.qty > 0);
    if (!items.length) { toast(t('Aucune quantité à réceptionner', 'لا توجد كمية للاستلام'), 'err'); return; }
    const added = items.reduce((a, x) => a + x.qty, 0);
    const done = await act(() => must(sb.rpc('receive_purchase', { p_po_id: po.id, p_items: items })), t(`${added} unité(s) ajoutée(s) au stock`, `تمت إضافة ${added} وحدة إلى المخزون`));
    if (done) onClose();
  };
  return (
    <Modal title={`${t('Réception', 'الاستلام')} ${po.ref}`} onClose={onClose}>
      <div className="space-y-2">
        {po.lines.map((l, i) => {
          const p = db.products.find(x => x.id === l.pid);
          return (
            <div key={i} className="flex items-center gap-3 rounded-xl border border-zinc-100 p-3">
              <div className="min-w-0 flex-1"><div className="truncate text-sm font-medium">{p ? pn(p) + (vLabelOf(p, l.vid, lang) ? ' · ' + vLabelOf(p, l.vid, lang) : '') : l.pid}</div><div className="text-xs text-zinc-500">{t('Reçu', 'مستلم')} {l.received} / {l.qty}</div></div>
              <Input type="number" min="0" max={l.qty - l.received} value={q[i]} onChange={e => setQ(q.map((v, k) => k === i ? e.target.value : v))} className="w-24" />
            </div>
          );
        })}
      </div>
      <div className="mt-5 flex justify-end gap-2"><Btn v="ghost" onClick={onClose}>{t('Annuler', 'إلغاء')}</Btn><Btn v="accent" onClick={confirm}><Icon n="check" s={15} />{t('Valider la réception', 'تأكيد الاستلام')}</Btn></div>
    </Modal>
  );
}
function Achats() {
  const { db, act, t, pn, money, toast, lang } = useApp();
  const [supId, setSupId] = useState(db.suppliers[0]?.id || '');
  const [expected, setExpected] = useState(addDays(5));
  const [lines, setLines] = useState([]);
  const [pick, setPick] = useState((db.products[0]?.variants[0] || {}).id || '');
  const [pq, setPq] = useState(10);
  const [recv, setRecv] = useState(null);
  const supName = id => db.suppliers.find(s => s.id === id)?.name || '—';
  const lineTotal = l => l.qty * l.cost;
  const addLine = () => {
    const p = db.products.find(x => x.variants.some(v => v.id === pick));
    if (!p) return;
    setLines(l => [...l, { pid: p.id, vid: pick, qty: Math.max(1, Number(pq) || 1), cost: p.cost }]);
  };
  const mailPO = (supplierId, ref, exp, ls) => {
    const sup = db.suppliers.find(x => x.id === supplierId);
    if (!sup || !sup.email) { toast(t('Ce fournisseur n’a pas d’email : ajoutez-le dans Fournisseurs', 'لا يوجد بريد لهذا المورد'), 'err'); return; }
    const rows = ls.map(l => { const p = db.products.find(x => x.id === l.pid); const lab = p ? vLabelOf(p, l.vid, 'fr') : ''; return `- ${p ? p.name : '?'}${lab ? ' (' + lab + ')' : ''} : ${l.qty} x ${l.cost} DA`; }).join('\n');
    const total = ls.reduce((a, l) => a + l.qty * l.cost, 0);
    const subject = `Bon de commande ${ref || ''} - Magasin`.replace('  ', ' ');
    const body = `Bonjour ${sup.contact || sup.name},\n\nVoici notre bon de commande${ref ? ' ' + ref : ''} :\n\n${rows}\n\nTotal : ${total} DA\nLivraison souhaitée : ${exp || '—'}\n\nMerci de confirmer la réception de cette commande.\n\nCordialement,\nMagasin`;
    window.location.href = `mailto:${encodeURIComponent(sup.email).replace('%40', '@')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  };
  const createPO = async status => {
    if (!lines.length) { toast(t('Ajoutez au moins une ligne', 'أضف سطراً واحداً على الأقل'), 'err'); return; }
    if (!supId) { toast(t('Choisissez un fournisseur', 'اختر موردا'), 'err'); return; }
    const done = await act(() => must(sb.rpc('create_purchase_order', { p_supplier_id: supId, p_expected: expected || null, p_items: lines.map(l => ({ variant_id: l.vid, qty: l.qty, unit_cost: l.cost })), p_send: status !== 'Brouillon' })),
      status === 'Brouillon' ? t('Brouillon enregistré', 'تم حفظ المسودة') : t('Bon de commande envoyé au fournisseur', 'تم إرسال طلب الشراء إلى المورد'));
    if (done) { if (status !== 'Brouillon') mailPO(supId, '', expected, lines); setLines([]); }
  };
  const createRestock = (supplierId, items) => act(() => must(sb.rpc('create_purchase_order', { p_supplier_id: supplierId, p_expected: null, p_items: items.flatMap(p => { const per = Math.ceil(Math.max(p.reorder * 2 - p.stock, p.reorder) / Math.max(1, p.variants.length)); return p.variants.map(v => ({ variant_id: v.id, qty: per, unit_cost: p.cost })); }), p_send: false })), t('Brouillon de réassort créé', 'تم إنشاء مسودة إعادة التخزين'));
  const send = async id => {
    const po = db.purchases.find(x => x.id === id);
    const done = await act(() => must(sb.rpc('set_po_status', { p_po_id: id, p_status: 'envoyee' })), t('Bon de commande envoyé au fournisseur', 'تم إرسال طلب الشراء إلى المورد'));
    if (done && po) mailPO(po.supplierId, po.ref, po.expected, po.lines);
  };
  const low = db.products.filter(p => p.stock <= p.reorder);
  const groups = db.suppliers.map(s => ({ s, items: low.filter(p => p.sup === s.id) })).filter(g => g.items.length);
  const openPOs = db.purchases.filter(p => ['Envoyée', 'Confirmée', 'Expédiée', 'Reçue partiellement'].includes(p.status)).length;
  return (
    <div>
      <PageTitle title={t('Achat · Bons de commande', 'المشتريات · طلبات الشراء')} sub={t('Créer, envoyer et réceptionner les commandes fournisseurs', 'إنشاء الطلبات للموردين وإرسالها واستلامها')} />
      <div className="mb-4 grid gap-3 sm:grid-cols-3">
        <Kpi label={t('Commandes ouvertes', 'طلبات مفتوحة')} value={openPOs} icon="truck" tone="blue" />
        <Kpi label={t('Brouillons', 'مسودات')} value={db.purchases.filter(p => p.status === 'Brouillon').length} icon="edit" tone="zinc" />
        <Kpi label={t('Réassort requis', 'إعادة تخزين مطلوبة')} value={low.length} icon="alert" tone="amber" hint={t('Stock ≤ seuil', 'المخزون ≤ الحد')} />
      </div>
      {groups.length > 0 && (
        <Card className="mb-4 p-5">
          <h2 className="mb-3 font-semibold">{t('Réassort suggéré', 'إعادة التخزين المقترحة')}</h2>
          <div className="grid gap-3 md:grid-cols-2">
            {groups.map(g => (
              <div key={g.s.id} className="rounded-xl border border-zinc-100 p-4">
                <div className="mb-2 flex items-center justify-between"><span className="font-medium">{g.s.name}</span><span className="text-xs text-zinc-500">{t('Délai', 'المهلة')} {g.s.leadDays} j</span></div>
                <div className="mb-3 space-y-1 text-sm text-zinc-600">{g.items.map(p => <div key={p.id} className="flex justify-between"><span className="truncate">{pn(p)}</span><span className="tabular">{p.stock} → {Math.max(p.reorder * 2 - p.stock, p.reorder)}</span></div>)}</div>
                <Btn v="soft" className="w-full" onClick={() => createRestock(g.s.id, g.items)}><Icon n="plus" s={14} />{t('Créer un brouillon', 'إنشاء مسودة')}</Btn>
              </div>
            ))}
          </div>
        </Card>
      )}
      <Card className="mb-4 p-5">
        <h2 className="mb-3 font-semibold">{t('Nouveau bon de commande', 'طلب شراء جديد')}</h2>
        <div className="grid gap-3 md:grid-cols-4">
          <Field label={t('Fournisseur', 'المورد')}><Select value={supId} onChange={e => setSupId(e.target.value)}>{db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</Select></Field>
          <Field label={t('Livraison prévue', 'التسليم المتوقع')}><Input type="date" value={expected} onChange={e => setExpected(e.target.value)} /></Field>
          <Field label={t('Produit / variante', 'المنتج / المتغير')}><Select value={pick} onChange={e => setPick(e.target.value)}>{db.products.flatMap(p => p.variants.map(v => <option key={v.id} value={v.id}>{p.name}{vLabel(v, 'fr') ? ' — ' + vLabel(v, 'fr') : ''} ({v.sku})</option>))}</Select></Field>
          <div className="flex items-end gap-2"><Field label={t('Quantité', 'الكمية')}><Input type="number" min="1" value={pq} onChange={e => setPq(e.target.value)} /></Field><Btn v="soft" onClick={addLine} className="mb-px"><Icon n="plus" s={14} />{t('Ligne', 'سطر')}</Btn></div>
        </div>
        {lines.length > 0 && (
          <div className="mt-4 divide-y divide-zinc-100 rounded-xl border border-zinc-100">
            {lines.map((l, i) => { const p = db.products.find(x => x.id === l.pid); return (
              <div key={i} className="flex items-center gap-3 px-3 py-2 text-sm">
                <span className="flex-1 truncate">{p && pn(p)}{vLabelOf(p, l.vid, lang) ? ' · ' + vLabelOf(p, l.vid, lang) : ''}</span>
                <span className="tabular text-zinc-500">{l.qty} × {money(l.cost)}</span>
                <span className="tabular w-28 text-end font-semibold">{money(lineTotal(l))}</span>
                <button onClick={() => setLines(lines.filter((_, k) => k !== i))} className="rounded-lg p-1 text-zinc-400 hover:bg-zinc-100 hover:text-rose-600"><Icon n="trash" s={14} /></button>
              </div>); })}
            <div className="flex items-center justify-between bg-zinc-50 px-3 py-2 text-sm font-semibold"><span>{supName(supId)}</span><span className="tabular">{money(lines.reduce((s, l) => s + lineTotal(l), 0))}</span></div>
          </div>
        )}
        <div className="mt-4 flex flex-wrap justify-end gap-2">
          <Btn v="ghost" onClick={() => createPO('Brouillon')}>{t('Enregistrer brouillon', 'حفظ كمسودة')}</Btn>
          <Btn onClick={() => createPO('Envoyée')}><Icon n="send" s={14} />{t('Envoyer au fournisseur', 'إرسال إلى المورد')}</Btn>
        </div>
      </Card>
      <Card className="overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-zinc-50 text-xs uppercase tracking-wider text-zinc-500"><tr>
              {[t('Référence', 'المرجع'), t('Fournisseur', 'المورد'), t('Date', 'التاريخ'), t('Livraison', 'التسليم'), t('Quantités', 'الكميات'), t('Montant', 'المبلغ'), t('Statut', 'الحالة'), ''].map((h, i) => <th key={i} className="px-4 py-3 text-start font-semibold">{h}</th>)}
            </tr></thead>
            <tbody className="divide-y divide-zinc-100">
              {db.purchases.map(po => {
                const qty = po.lines.reduce((s, l) => s + l.qty, 0), rec = po.lines.reduce((s, l) => s + l.received, 0);
                return (
                  <tr key={po.id} className="transition hover:bg-zinc-50">
                    <td className="px-4 py-3 font-mono text-xs font-semibold">{po.ref}</td>
                    <td className="px-4 py-3">{supName(po.supplierId)}</td>
                    <td className="tabular px-4 py-3 text-zinc-600">{po.date}</td>
                    <td className="tabular px-4 py-3 text-zinc-600">{po.expected}</td>
                    <td className="tabular px-4 py-3">{rec} / {qty}</td>
                    <td className="tabular px-4 py-3 font-medium">{money(po.lines.reduce((s, l) => s + lineTotal(l), 0))}</td>
                    <td className="px-4 py-3"><StatusBadge status={po.status} /></td>
                    <td className="px-4 py-3 text-end">
                      <Btn v="ghost" className="me-1 !px-2.5 !py-1 text-xs !text-rose-600" onClick={() => { if (confirm(t(`Supprimer le bon ${po.ref} ?`, `حذف الطلب ${po.ref}؟`))) act(() => must(sb.rpc('delete_purchase_order', { p_po_id: po.id })), t('Bon supprimé', 'تم حذف الطلب')); }}><Icon n="trash" s={13} /></Btn>
                      <Btn v="ghost" className="me-1 !px-2.5 !py-1 text-xs" onClick={() => mailPO(po.supplierId, po.ref, po.expected, po.lines)}><Icon n="send" s={13} />Email</Btn>
                      {po.status === 'Brouillon' && <Btn v="soft" onClick={() => send(po.id)}><Icon n="send" s={13} />{t('Envoyer', 'إرسال')}</Btn>}
                      {['Envoyée', 'Confirmée', 'Expédiée', 'Reçue partiellement'].includes(po.status) && <Btn v="accent" onClick={() => setRecv(po)}><Icon n="check" s={13} />{t('Réceptionner', 'استلام')}</Btn>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
      {recv && <ReceiveModal po={recv} onClose={() => setRecv(null)} />}
    </div>
  );
}

function EditSupplierModal({ s, onClose }) {
  const { act, t } = useApp();
  const [f, setF] = useState({ name: s.name, contact: s.contact, email: s.email, city: s.city, leadDays: s.leadDays });
  const save = async () => {
    if (!f.name.trim()) return;
    const done = await act(() => must(sb.from('suppliers').update({ name: f.name.trim(), contact_name: f.contact.trim() || null, email: f.email.trim() || null, city: f.city.trim() || null, lead_days: Math.max(1, Math.floor(+f.leadDays) || 5) }).eq('id', s.id)), t('Fournisseur mis à jour', 'تم تحديث المورد'));
    if (done) onClose();
  };
  const del = async () => {
    if (!confirm(t('Supprimer ce fournisseur ? Impossible s’il a des commandes.', 'حذف هذا المورد؟ غير ممكن إذا كانت له طلبات.'))) return;
    const done = await act(() => must(sb.from('suppliers').delete().eq('id', s.id)), t('Fournisseur supprimé', 'تم حذف المورد'));
    if (done) onClose();
  };
  return (
    <Modal title={`${t('Modifier', 'تعديل')} · ${s.name}`} onClose={onClose}>
      <div className="grid gap-3">
        <Field label={t('Nom', 'الاسم')}><Input value={f.name} onChange={e => setF({ ...f, name: e.target.value })} /></Field>
        <Field label={t('Contact', 'جهة الاتصال')}><Input value={f.contact} onChange={e => setF({ ...f, contact: e.target.value })} /></Field>
        <Field label="Email"><Input value={f.email} onChange={e => setF({ ...f, email: e.target.value })} dir="ltr" /></Field>
        <Field label={t('Ville', 'المدينة')}><Input value={f.city} onChange={e => setF({ ...f, city: e.target.value })} /></Field>
        <Field label={t('Délai (jours)', 'المهلة (أيام)')}><Input type="number" min="1" value={f.leadDays} onChange={e => setF({ ...f, leadDays: e.target.value })} /></Field>
      </div>
      <div className="mt-5 flex flex-wrap justify-between gap-2"><Btn v="danger" onClick={del}>{t('Supprimer', 'حذف')}</Btn><div className="flex gap-2"><Btn v="ghost" onClick={onClose}>{t('Annuler', 'إلغاء')}</Btn><Btn onClick={save}><Icon n="check" s={15} />{t('Enregistrer', 'حفظ')}</Btn></div></div>
    </Modal>
  );
}

/* ───────────────────────── Bons d'achat ───────────────────────── */
function EditVoucherModal({ v, onClose }) {
  const { act, t } = useApp();
  const [f, setF] = useState({ value: v.value, minTotal: v.minTotal, expires: v.expires, limit: v.limit });
  const save = async () => {
    if (+f.value <= 0 || (v.type === 'percent' && +f.value > 100)) return;
    const done = await act(() => must(sb.from('vouchers').update({ value: +f.value, min_total: +f.minTotal || 0, expires_at: f.expires, usage_limit: Math.max(v.used || 1, Math.floor(+f.limit) || 1) }).eq('id', v.id)), t('Bon mis à jour', 'تم تحديث القسيمة'));
    if (done) onClose();
  };
  const del = async () => {
    if (!confirm(t('Supprimer ce bon ?', 'حذف هذه القسيمة؟'))) return;
    const done = await act(() => must(sb.from('vouchers').delete().eq('id', v.id)), t('Bon supprimé', 'تم حذف القسيمة'));
    if (done) onClose();
  };
  return (
    <Modal title={`${t('Modifier', 'تعديل')} · ${v.code}`} onClose={onClose}>
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label={v.type === 'percent' ? t('Valeur (%)', 'القيمة (%)') : t('Valeur (DA)', 'القيمة (د.ج)')}><Input type="number" value={f.value} onChange={e => setF({ ...f, value: e.target.value })} /></Field>
        <Field label={t('Minimum d’achat (DA)', 'الحد الأدنى للشراء (د.ج)')}><Input type="number" value={f.minTotal} onChange={e => setF({ ...f, minTotal: e.target.value })} /></Field>
        <Field label={t('Expire le', 'ينتهي في')}><Input type="date" value={f.expires} onChange={e => setF({ ...f, expires: e.target.value })} /></Field>
        <Field label={t('Limite d’utilisations', 'حد الاستعمال')}><Input type="number" min="1" value={f.limit} onChange={e => setF({ ...f, limit: e.target.value })} /></Field>
      </div>
      <div className="mt-5 flex flex-wrap justify-between gap-2"><Btn v="danger" onClick={del} disabled={v.used > 0} title={v.used > 0 ? t('Déjà utilisé : désactivez-le', 'مستعمل: عطّله') : ''}>{t('Supprimer', 'حذف')}</Btn><div className="flex gap-2"><Btn v="ghost" onClick={onClose}>{t('Annuler', 'إلغاء')}</Btn><Btn onClick={save}><Icon n="check" s={15} />{t('Enregistrer', 'حفظ')}</Btn></div></div>
    </Modal>
  );
}
function Bons() {

    if (+f.value <= 0) { toast(t('Valeur invalide', 'قيمة غير صالحة'), 'err'); return; }

              <Field label={t('Remise', 'الخصم')}><Select value={f.type} onChange={e => set('type', e.target.value)}><option value="fixed">{t('Montant fixe', 'مبلغ ثابت')}</option><option value="percent">{t('Pourcentage', 'نسبة')}</option></Select></Field>

              <Field label={t("Date d'expiration", 'تاريخ الانتهاء')}><Input type="date" value={f.expires} onChange={e => set('expires', e.target.value)} /></Field>

    </div>

                    {qt.voucherDisc > 0 && <div className="flex justify-between text-emerald-700"><span>{t('Bon', 'قسيمة')}</span><span className="tabular">-{money(qt.voucherDisc)}</span></div>}

                    {qt.pointsEarned > 0 && <div className="text-end text-xs text-violet-700">+{qt.pointsEarned} {t('points gagnés', 'نقاط مكتسبة')}</div>}

}
function MesPoints() {
  const { db, t, money, clientId, setClientId, rules, pn } = useApp();
  const c = db.clients.find(x => x.id === clientId) || db.clients[0];

  const tier = tierOf(c.earned, rules);
  const next = tier === 'Bronze' ? { k: 'Silver', at: rules.tiers.Silver, from: 0 } : tier === 'Silver' ? { k: 'Gold', at: rules.tiers.Gold, from: rules.tiers.Silver } : null;
  const pct = next ? Math.min(100, ((c.earned - next.from) / (next.at - next.from)) * 100) : 100;
  const perks = { Bronze: [t(`1 point par ${rules.perDA} DA`, `نقطة واحدة لكل ${rules.perDA} د.ج`)], Silver: [t('+25 % de points', '+25٪ نقاط'), t('−3 % sur vos achats', '−3٪ على مشترياتك')], Gold: [t('+50 % de points', '+50٪ نقاط'), t('−5 % sur vos achats', '−5٪ على مشترياتك'), t('Accès prioritaire aux nouveautés', 'أولوية الوصول إلى الجديد')] };
  const available = db.vouchers.filter(v => v.active && v.expires >= today() && v.used < v.limit);
  const hist = db.sales.filter(s => s.clientId === c.id);
  return (
    <div>
      <PageTitle title={t('Mes points & bons', 'نقاطي وقسائمي')} sub={t('Votre fidélité, vos avantages et vos bons', 'ولاؤك ومزاياك وقسائمك')} right={
        <select value={clientId} onChange={e => setClientId(e.target.value)} className="rounded-xl border border-zinc-200 bg-white px-3 py-2 text-sm">{db.clients.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select>} />
      <div className="grid gap-4 lg:grid-cols-3">
        <div className="space-y-4 lg:col-span-2">
          <Card className="overflow-hidden p-6">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div><div className="text-sm text-zinc-500">{t('Solde de points', 'رصيد النقاط')}</div><div className="tabular mt-1 text-4xl font-extrabold tracking-tight">{fmtNum(c.pts)} <span className="text-lg font-medium text-zinc-400">pts</span></div><div className="tabular text-sm text-zinc-500">≈ {money(c.pts * rules.redeemValue)} {t('de réduction', 'من التخفيض')}</div></div>
              <Badge tone={tier === 'Gold' ? 'dark' : tier === 'Silver' ? 'zinc' : 'amber'}>{tier}</Badge>
            </div>
            <div className="mt-6">
              <div className="mb-2 flex justify-between text-xs text-zinc-500"><span>{t('Progression', 'التقدم')}</span><span className="tabular">{next ? `${fmtNum(c.earned)} / ${fmtNum(next.at)} pts → ${next.k}` : t('Niveau maximum atteint', 'أعلى مستوى')}</span></div>
              <div className="h-2.5 overflow-hidden rounded-full bg-zinc-100"><div className="h-2.5 rounded-full bg-gradient-to-r from-zinc-700 to-zinc-900 transition-all duration-700" style={{ width: `${pct}%` }} /></div>
            </div>
            <div className="mt-5 flex flex-wrap gap-2">{perks[tier].map(p => <span key={p} className="rounded-full bg-zinc-100 px-3 py-1 text-xs font-medium text-zinc-700">✓ {p}</span>)}</div>
          </Card>
          <Card className="p-5">
            <h2 className="mb-3 font-semibold">{t('Historique d’achats', 'سجل المشتريات')}</h2>
            <div className="divide-y divide-zinc-100">
              {hist.slice(0, 8).map(s => <div key={s.id} className="flex items-center gap-3 py-3 text-sm"><Icon n="receipt" s={16} className="text-zinc-400" /><div className="flex-1"><div className="font-medium">{s.ref} · {s.channel === 'Web' ? t('Site web', 'الموقع') : t('Magasin', 'المتجر')}</div><div className="text-xs text-zinc-500">{s.date}</div></div><div className="text-end"><div className="tabular font-semibold">{money(s.total)}</div>{s.pointsEarned > 0 && <div className="tabular text-xs text-violet-700">+{s.pointsEarned} pts</div>}</div></div>)}
              {hist.length === 0 && <div className="py-6 text-center text-sm text-zinc-400">{t('Aucun achat pour le moment', 'لا توجد مشتريات بعد')}</div>}

/* ───────────────────────── Portail fournisseur ───────────────────────── */
function Fournisseur({ mode }) {
  const { db, act, t, pn, money, toast, supplierId, lang } = useApp();
  const sup = db.suppliers.find(s => s.id === supplierId) || db.suppliers[0];
  if (!sup) return <Card className="p-8 text-center text-sm text-zinc-500">{t('Ce compte n’est lié à aucun fournisseur. Demandez à l’administrateur de le rattacher.', 'هذا الحساب غير مرتبط بأي مورد. اطلب من المدير ربطه.')}</Card>;
  const pos = db.purchases.filter(p => p.supplierId === sup.id && p.status !== 'Brouillon');
  const advance = (id, from, to) => act(() => must(sb.rpc('set_po_status', { p_po_id: id, p_status: PO_TO[to] })), t('Statut mis à jour', 'تم تحديث الحالة'));
  const restock = db.products.filter(p => p.sup === sup.id && p.stock <= p.reorder);
  const accept = () => act(() => must(sb.rpc('supplier_accept_restock')), t('Réassort accepté · bon confirmé', 'تم قبول إعادة التخزين · الطلب مؤكد'));
  return (
    <div>
      <PageTitle title={mode === 'reassort' ? t('Demandes de réassort', 'طلبات إعادة التخزين') : t('Mes commandes', 'طلباتي')} sub={`${sup.name} · ${t('délai', 'المهلة')} ${sup.leadDays} j`} right={<div className="w-full sm:w-auto"><SupplierSelect /></div>} />
      {mode === 'portail' && (
        <div className="space-y-4">
          {pos.length === 0 && <Card className="p-8 text-center text-sm text-zinc-500">{t('Aucune commande en cours', 'لا توجد طلبات حالياً')}</Card>}
          {pos.map(po => (
            <Card key={po.id} className="p-5">
              <div className="flex flex-wrap items-start justify-between gap-3">
                <div><div className="font-mono text-sm font-bold">{po.ref}</div><div className="text-xs text-zinc-500">{t('Émise le', 'صدر في')} {po.date} · {t('Livraison prévue', 'التسليم المتوقع')} <span className="tabular">{po.expected}</span></div></div>
                <StatusBadge status={po.status} />
              </div>
              <div className="my-5"><Timeline status={po.status} /></div>
              <div className="divide-y divide-zinc-100 rounded-xl border border-zinc-100 text-sm">
                {po.lines.map((l, i) => { const p = db.products.find(x => x.id === l.pid); return (
                  <div key={i} className="flex items-center gap-3 px-3 py-2"><span>{p && p.emoji}</span><span className="flex-1 truncate">{p && pn(p)}{vLabelOf(p, l.vid, lang) ? ' · ' + vLabelOf(p, l.vid, lang) : ''}</span><span className="tabular text-zinc-500">{l.received}/{l.qty}</span><span className="tabular w-24 text-end">{money(l.qty * l.cost)}</span></div>); })}
              </div>
              <div className="mt-4 flex flex-wrap justify-end gap-2">
                {po.status === 'Envoyée' && <Btn onClick={() => advance(po.id, 'Envoyée', 'Confirmée')}><Icon n="check" s={14} />{t('Confirmer la commande', 'تأكيد الطلب')}</Btn>}
                {po.status === 'Confirmée' && <Btn v="soft" onClick={() => advance(po.id, 'Confirmée', 'Expédiée')}><Icon n="truck" s={14} />{t('Marquer expédiée', 'تحديد كمشحون')}</Btn>}
                {po.status === 'Expédiée' && <span className="self-center text-xs text-zinc-500">{t('En attente de réception au magasin', 'في انتظار الاستلام في المتجر')}</span>}
              </div>
            </Card>
          ))}
        </div>
      )}
      {mode === 'reassort' && (
        <Card className="p-5">
          {restock.length === 0 ? <div className="py-8 text-center text-sm text-zinc-500">{t('Aucun réassort demandé pour ce fournisseur ✓', 'لا توجد طلبات إعادة تخزين لهذا المورد ✓')}</div> : <>
            <div className="mb-4 rounded-xl bg-amber-50 p-3 text-sm text-amber-800">{t('Ces articles sont sous leur seuil de réassort.', 'هذه القطع أقل من حد إعادة التخزين.')}</div>
            <div className="divide-y divide-zinc-100">
              {restock.map(p => <div key={p.id} className="flex items-center gap-3 py-3"><Thumb p={p} cls="h-10 w-10 rounded-lg" txt="text-xl" /><div className="flex-1"><div className="font-medium">{pn(p)}</div><div className="text-xs text-zinc-500">{t('Stock', 'المخزون')} {p.stock} · {t('seuil', 'الحد')} {p.reorder}</div></div><div className="tabular text-sm">→ {Math.max(p.reorder * 2 - p.stock, p.reorder)} {t('pcs', 'قطع')}</div></div>)}
            </div>
            <Btn className="mt-4 w-full" onClick={accept}><Icon n="check" s={14} />{t('Accepter le réassort', 'قبول إعادة التخزين')}</Btn>
          </>}
        </Card>
      )}
    </div>
  );
}

              {users.map(u => (
                <tr key={u.id} className="border-b border-zinc-50 last:border-0">
                  <td className="px-4 py-3 font-medium">{u.full_name || '—'}</td>

                    {u.role === 'fournisseur'
                      ? <select value={u.supplier_id || ''} onChange={e => setRole(u, 'fournisseur', e.target.value)} className={sel}><option value="">{t('— choisir —', '— اختر —')}</option>{db.suppliers.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select>
                      : <span className="text-zinc-400">—</span>}
                  </td>
                </tr>

          </table>
        </Card>
      )}

}

/* ───────────────────────── Inventaire ───────────────────────── */
function Inventaire() {
  const { db, act, t, pn, money, toast, lang } = useApp();
  const [q, setQ] = useState('');
  const [counts, setCounts] = useState({});
  const [onlyDiff, setOnlyDiff] = useState(false);
  const norm = x => String(x || '').toLowerCase();
  const prods = db.products.filter(p => !q || norm(p.name + p.ar + p.sku).includes(norm(q)));
  const diffOf = v => { const c = counts[v.id]; return c === undefined || c === '' ? null : Math.max(0, Math.floor(Number(c) || 0)) - v.stock; };
  const allV = db.products.flatMap(p => p.variants.map(v => ({ v, p })));
  const counted = allV.filter(x => diffOf(x.v) !== null).length;
  const diffs = allV.filter(x => diffOf(x.v) !== null && diffOf(x.v) !== 0);
  const gap = diffs.reduce((a, x) => a + diffOf(x.v) * x.p.cost, 0);
  const validate = async () => {
    if (!diffs.length) { toast(t('Aucun écart à corriger', 'لا توجد فروقات'), 'err'); return; }
    if (!confirm(t(`Corriger le stock de ${diffs.length} variante(s) d’après votre comptage ?`, `تصحيح مخزون ${diffs.length} متغير حسب الجرد؟`))) return;
    const items = diffs.map(x => ({ variant_id: x.v.id, delta: diffOf(x.v) }));
    const done = await act(() => must(sb.rpc('adjust_stock', { p_items: items, p_note: 'Inventaire ' + today() })), t(`Inventaire validé : ${items.length} correction(s)`, `تم اعتماد الجرد: ${items.length} تصحيح`));
    if (done) setCounts({});
  };
  const printSheet = () => {
    const rows = prods.flatMap(p => p.variants.map(v => `<tr><td>${escH(p.name)}</td><td>${escH(vLabel(v, 'fr') || 'Standard')}</td><td>${escH(v.sku)}</td><td class="r">${v.stock}</td><td></td></tr>`)).join('');
    printHTML(`<!doctype html><html><head><meta charset="utf-8"><title>Inventaire</title><style>${A4_CSS}</style></head><body><h1>Feuille d’inventaire</h1><div class="muted">Magasin DJ · ${today()}</div><table><thead><tr><th>Produit</th><th>Variante</th><th>SKU</th><th class="r">Système</th><th style="width:90px">Compté</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);
  };
  return (
    <div>
      <PageTitle title={t('Inventaire', 'الجرد')} sub={t('Saisissez les quantités comptées : les écarts corrigent le stock à la validation.', 'أدخل الكميات المعدودة: تُصحَّح الفروقات عند الاعتماد.')}
        right={<div className="flex gap-2"><Btn v="ghost" onClick={printSheet}><Icon n="receipt" s={15} />{t('Feuille à imprimer', 'ورقة للطباعة')}</Btn><Btn onClick={validate} disabled={!diffs.length}><Icon n="check" s={15} />{t('Valider l’inventaire', 'اعتماد الجرد')}</Btn></div>} />
      <div className="mb-4 grid gap-3 sm:grid-cols-3">
        <Card className="p-4"><div className="text-xs text-zinc-500">{t('Variantes comptées', 'متغيرات معدودة')}</div><div className="tabular mt-1 text-xl font-bold">{counted} <span className="text-sm font-medium text-zinc-400">/ {allV.length}</span></div></Card>
        <Card className={`p-4 ${diffs.length ? 'bg-amber-50' : ''}`}><div className="text-xs text-zinc-500">{t('Écarts', 'الفروقات')}</div><div className="tabular mt-1 text-xl font-bold">{diffs.length}</div></Card>
        <Card className="p-4"><div className="text-xs text-zinc-500">{t('Valeur de l’écart (coût)', 'قيمة الفرق (التكلفة)')}</div><div className={`tabular mt-1 text-xl font-bold ${gap < 0 ? 'text-rose-600' : gap > 0 ? 'text-emerald-600' : ''}`}>{gap > 0 ? '+' : ''}{money(gap)}</div></Card>
      </div>
      <Card className="overflow-hidden">
        <div className="flex flex-wrap items-center gap-3 p-3">
          <div className="relative min-w-48 flex-1"><Icon n="search" s={15} className="absolute start-3 top-2.5 text-zinc-400" /><Input value={q} onChange={e => setQ(e.target.value)} placeholder={t('Rechercher nom ou SKU…', 'ابحث بالاسم أو الرمز…')} className="ps-9" /></div>
          <label className="flex cursor-pointer items-center gap-1.5 text-xs text-zinc-600"><input type="checkbox" checked={onlyDiff} onChange={e => setOnlyDiff(e.target.checked)} />{t('Écarts seulement', 'الفروقات فقط')}</label>
          {counted > 0 && <button onClick={() => setCounts({})} className="text-xs text-rose-600 underline">{t('Effacer le comptage', 'مسح الجرد')}</button>}
        </div>
        <div className="divide-y divide-zinc-100">
          {prods.map(p => {
            const vs = p.variants.filter(v => !onlyDiff || (diffOf(v) !== null && diffOf(v) !== 0));
            if (!vs.length) return null;
            return (
              <div key={p.id} className="p-3">
                <div className="mb-1.5 flex items-center gap-2"><Thumb p={p} cls="h-8 w-8 rounded-lg" txt="text-sm" /><div className="min-w-0"><div className="truncate text-sm font-semibold">{pn(p)}</div><div className="font-mono text-[11px] text-zinc-500">{p.sku}</div></div></div>
                <div className="grid gap-1.5 sm:grid-cols-2 xl:grid-cols-3">
                  {vs.map(v => { const d = diffOf(v); const c = v.color ? parseColor(v.color) : null; return (
                    <div key={v.id} className={`flex items-center gap-2 rounded-2xl px-3 py-1.5 text-sm ${d ? 'bg-amber-50' : 'bg-zinc-50'}`}>
                      {c && <span className="inline-block h-3.5 w-3.5 shrink-0 rounded-full border border-zinc-300" style={dotStyle(c.hex)} />}
                      <span className="min-w-0 flex-1 truncate">{vLabel(v, lang) || t('Standard', 'قياسي')}</span>
                      <span className="tabular w-10 text-end text-xs text-zinc-500" title={t('Stock système', 'مخزون النظام')}>{v.stock}</span>
                      <input type="number" min="0" value={counts[v.id] === undefined ? '' : counts[v.id]} onChange={e => setCounts({ ...counts, [v.id]: e.target.value })} placeholder="—" className="tabular w-16 rounded-full border border-zinc-200 bg-white px-2 py-1 text-center text-sm outline-none focus:ring-2 focus:ring-zinc-900/10" />
                      <span className={`tabular w-10 text-end text-xs font-semibold ${d > 0 ? 'text-emerald-600' : d < 0 ? 'text-rose-600' : 'text-zinc-300'}`}>{d === null ? '' : d > 0 ? '+' + d : d}</span>
                    </div>); })}
                </div>
              </div>
            );
          })}
          {prods.length === 0 && <div className="p-8 text-center text-sm text-zinc-500">{t('Aucun produit', 'لا توجد منتجات')}</div>}
        </div>
      </Card>
    </div>
  );
}

/* ───────────────────────── Bons de réception ───────────────────────── */
function Receptions() {
  const { db, t, money, lang } = useApp();
  const rows = db.receipts.map(r => {
    const po = db.purchases.find(x => x.id === r.poId);
    const sup = po && db.suppliers.find(x => x.id === po.supplierId);
    const lines = r.lines.map(l => {
      const p = db.products.find(x => x.id === l.pid);
      const pl = po && po.lines.find(x => x.vid === l.vid);
      const cost = pl ? pl.cost : (p ? p.cost : 0);
      return { name: p ? p.name : '?', label: p ? vLabelOf(p, l.vid, 'fr') : '', qty: l.qty, cost };
    });
    return { ...r, poRef: po ? po.ref : '—', supName: sup ? sup.name : '—', lines, qty: lines.reduce((a, l) => a + l.qty, 0), value: lines.reduce((a, l) => a + l.qty * l.cost, 0) };
  });
  const print = r => {
    const body = r.lines.map(l => `<tr><td>${escH(l.name)}${l.label ? ' (' + escH(l.label) + ')' : ''}</td><td class="r">${l.qty}</td><td class="r">${l.cost}</td><td class="r">${l.qty * l.cost}</td></tr>`).join('');
    printHTML(`<!doctype html><html><head><meta charset="utf-8"><title>${r.no}</title><style>${A4_CSS}</style></head><body><h1>Bon de réception ${r.no}</h1><div class="muted">Magasin DJ · ${escH(r.at.slice(0, 10))}</div><h2>Fournisseur : ${escH(r.supName)} · Commande ${escH(r.poRef)}</h2><table><thead><tr><th>Article</th><th class="r">Qté reçue</th><th class="r">Coût unit. (DA)</th><th class="r">Total (DA)</th></tr></thead><tbody>${body}<tr><th>Total</th><th class="r">${r.qty}</th><th></th><th class="r">${r.value}</th></tr></tbody></table><p style="margin-top:40px">Signature : ____________________</p></body></html>`);
  };
  return (
    <div>
      <PageTitle title={t('Bons de réception', 'سندات الاستلام')} sub={t('Un bon est créé à chaque réception de marchandise (onglet Achats → Réceptionner).', 'يُنشأ سند عند كل استلام للبضاعة (المشتريات ← استلام).')} />
      <div className="grid gap-3 lg:grid-cols-2">
        {rows.map(r => (
          <Card key={r.id} className="p-4">
            <div className="flex items-start justify-between gap-2">
              <div><div className="font-bold">{r.no}</div><div className="text-xs text-zinc-500">{r.at.slice(0, 10)} · {t('Commande', 'الطلب')} {r.poRef} · {r.supName}</div></div>
              <Btn v="ghost" className="!px-3 !py-1 text-xs" onClick={() => print(r)}><Icon n="receipt" s={13} />{t('Imprimer', 'طباعة')}</Btn>
            </div>
            <div className="mt-3 space-y-1">
              {r.lines.map((l, i) => <div key={i} className="flex items-center justify-between rounded-2xl bg-zinc-50 px-3 py-1.5 text-sm"><span className="min-w-0 truncate">{l.name}{l.label && <span className="ms-1 text-xs text-zinc-500">({l.label})</span>}</span><span className="tabular shrink-0 font-semibold">+{l.qty}</span></div>)}
            </div>
            <div className="mt-3 flex justify-between border-t border-zinc-100 pt-2 text-sm"><span className="text-zinc-500">{r.qty} {t('pièces reçues', 'قطعة مستلمة')}</span><span className="tabular font-bold">{money(r.value)}</span></div>
          </Card>
        ))}
      </div>
      {rows.length === 0 && <Card className="p-10 text-center text-sm text-zinc-500">{t('Aucune réception pour le moment', 'لا يوجد استلام حتى الآن')}</Card>}
    </div>
  );
}

function PosEntry() { const { role } = useApp(); return role === 'admin' ? <Hub tabs={VENTES_TABS} initial="comptoir" /> : <POS />; }
function Hub({ tabs, initial }) {
  const { t, lang } = useApp();
  const [tab, setTab] = useState(initial);
  const [seen, setSeen] = useState({ [initial]: true });
  const go = k => { setTab(k); setSeen(x => ({ ...x, [k]: true })); };
  return (
    <div>
      <div className="mb-5 inline-flex max-w-full flex-wrap gap-1 rounded-full bg-white p-1.5 shadow-sm">

      </div>
      {tabs.map(x => seen[x.k] && <div key={x.k} className={tab === x.k ? '' : 'hidden'}><x.C /></div>)}
    </div>
  );
}

function Shell({ session, lang, setLang }) {
  const [db, setDb] = useState(EMPTY_DB);
  const [profile, setProfile] = useState(null);
  const [boot, setBoot] = useState({ loading: true, error: null });
  const [view, setView] = useState('');
  const [toasts, setToasts] = useState([]);
  const [supplierSel, setSupplierId] = useState('');
  const [clientSel, setClientId] = useState('');
  const [receipt, setReceipt] = useState(null);
  const [busy, setBusy] = useState(false);

  const t = (fr, ar) => lang === 'ar' ? ar : fr;
  const pn = p => lang === 'ar' ? p.ar : p.name;
  const money = n => fmtNum(n) + (lang === 'ar' ? ' د.ج' : ' DA');
  const toast = (msg, tone = 'ok') => {
    const id = uid('t');
    setToasts(x => [...x, { id, msg, tone }]);
    setTimeout(() => setToasts(x => x.filter(y => y.id !== id)), 3200);
  };
  const role = profile ? profile.role : null;
  const clientId = role === 'client' ? (profile.client_id || '') : clientSel;
  const supplierId = role === 'fournisseur' ? (profile.supplier_id || '') : supplierSel;

  useEffect(() => {
    let off = false;
    (async () => {
      try {
        const p = await must(sb.from('profiles').select('role, full_name, supplier_id, client_id').eq('id', session.user.id).maybeSingle());
        if (!p) throw new Error('PROFILE_MISSING');
        const d = await loadAll(p.role);
        if (off) return;
        setProfile(p); setDb(d); setView(NAV[p.role][0].k); setBoot({ loading: false, error: null });
      } catch (e) { if (!off) setBoot({ loading: false, error: e.message === 'PROFILE_MISSING' ? 'PROFILE_MISSING' : errText(e, (a) => a) }); }
    })();
    return () => { off = true; };
  }, [session.user.id]);

  const reload = async () => { const d = await loadAll(role); setDb(d); return d; };
  const act = async (fn, okMsg) => {
    setBusy(true);
    try { await fn(); await reload(); if (okMsg) toast(okMsg); return true; }
    catch (e) { toast(errText(e, t), 'err'); return false; }
    finally { setBusy(false); }
  };
  const quote = args => quoteSale(db, args, t);
  const checkout = async args => {
    const q = quoteSale(db, args, t);
    if (!q.lines.length) { toast(t('Panier vide', 'السلة فارغة'), 'err'); return null; }
    if (q.stockErr) { toast(t(`Stock insuffisant : ${q.stockErr.name}`, `مخزون غير كافٍ: ${q.stockErr.ar}`), 'err'); return null; }
    if (q.error) { toast(q.error, 'err'); return null; }
    setBusy(true);
    try {
      const row = await must(sb.rpc('create_sale', { p_channel: args.channel === 'Web' ? 'web' : 'pos', p_client_id: args.clientId || null, p_items: q.lines.map(l => ({ variant_id: l.vid, qty: l.qty, unit_price: l.price })), p_voucher_code: args.code ? args.code.trim() : null, p_points_used: q.pointsUsed }));
      const d = await reload();
      const sale = d.sales.find(x => x.id === row.id) || null;
      toast(t(`Vente ${row.ref} encaissée`, `تم تسجيل البيع ${row.ref}`));
      if (sale) setReceipt(sale);
      return sale || row;
    } catch (e) { toast(errText(e, t), 'err'); return null; }
    finally { setBusy(false); }
  };
  const logout = async () => {
    try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
    try { Object.keys(localStorage).filter(k => k.startsWith('magasin-dj-auth')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    location.reload();
  };

  if (boot.loading) return <div className="grid min-h-screen place-items-center text-sm text-zinc-500">{t('Chargement…', 'جارٍ التحميل…')}</div>;
  if (boot.error) return (
    <div className="grid min-h-screen place-items-center p-6"><Card className="max-w-md p-6 text-center">
      <div className="text-lg font-bold">{t('Impossible de charger votre espace', 'تعذر تحميل مساحتك')}</div>
      <p className="mt-2 text-sm text-zinc-600">{boot.error === 'PROFILE_MISSING' ? t('Profil introuvable pour ce compte.', 'لم يتم العثور على ملف لهذا الحساب.') : boot.error}</p>
      <div className="mt-4 flex justify-center gap-2"><Btn v="ghost" onClick={() => location.reload()}>{t('Réessayer', 'إعادة المحاولة')}</Btn><Btn onClick={logout}>{t('Se déconnecter', 'تسجيل الخروج')}</Btn></div>
    </Card></div>
  );

  const ctx = { db, act, reload, busy, toast, t, lang, pn, money, role, view, setView, supplierId, setSupplierId, clientId, setClientId, quote, checkout, rules: db.rules, setReceipt };
  const View = VIEWS[view] || Dashboard;
  const navKey = role === 'admin' ? ({ achat: 'stock', fourn: 'stock', pos: 'ventes' }[view] || view) : view;

  return (
    <Ctx.Provider value={ctx}>
      <div className="flex min-h-screen flex-col">
        <header className="sticky top-0 z-30 bg-[#e6e6e8]/85 backdrop-blur">
          <div className="flex h-14 items-center gap-3 px-4">
            <div className="flex items-center gap-2.5">
              <div className="text-xl font-black uppercase tracking-tight">DJ</div>
              <div className="hidden leading-tight sm:block"><div className="text-sm font-extrabold uppercase tracking-wide">Magasin</div><div className="text-[11px] text-zinc-500">{t('Gestion du magasin', 'إدارة المتجر')}</div></div>
            </div>
            <div className="ms-auto flex items-center gap-2">
              <div className="hidden text-end leading-tight sm:block"><div className="max-w-[180px] truncate text-xs font-semibold">{profile.full_name || session.user.email}</div><div className="text-[11px] text-zinc-500">{(ROLES.find(r => r.k === role) || {})[lang === 'ar' ? 'ar' : 'fr']}</div></div>
              <button onClick={() => setLang(lang === 'fr' ? 'ar' : 'fr')} className="flex items-center gap-1 rounded-full bg-white px-3 py-1.5 text-xs font-semibold hover:bg-zinc-50"><Icon n="globe" s={14} />{lang === 'fr' ? 'عربي' : 'FR'}</button>
              {role === 'admin' || role === 'vendeur' ? <Notifs /> : null}
              <button onClick={() => act(async () => {}, t('Données actualisées', 'تم تحديث البيانات'))} title={t('Actualiser', 'تحديث')} className={`rounded-xl p-2 text-zinc-500 hover:bg-zinc-100 ${busy ? 'animate-spin' : ''}`}><Icon n="refresh" s={16} /></button>
              <button onClick={logout} className="rounded-full bg-white px-3 py-1.5 text-xs font-semibold hover:bg-zinc-50">{t('Déconnexion', 'خروج')}</button>
            </div>
          </div>
        </header>

        <div className="flex flex-1">
          <aside className="hidden w-60 shrink-0 flex-col gap-1 p-3 md:flex">
            <div className="px-2 pb-2 pt-1 text-[11px] font-semibold uppercase tracking-wider text-zinc-400">{lang === 'ar' ? ROLE_LABEL[role][1] : ROLE_LABEL[role][0]}</div>
            {NAV[role].map(n => (
              <button key={n.k} onClick={() => setView(n.k)} className={`flex items-center gap-2.5 rounded-full px-4 py-2.5 text-sm font-semibold transition ${navKey === n.k ? 'bg-zinc-900 text-white' : 'text-zinc-600 hover:bg-white'}`}>
                <Icon n={n.ic} s={16} />{lang === 'ar' ? n.ar : n.fr}
              </button>
            ))}
            <div className="mt-auto rounded-2xl bg-white/60 p-3 text-[11px] leading-relaxed text-zinc-500">{t('Données en direct. Stock : Vente −, Achat réceptionné +.', 'بيانات مباشرة. المخزون: البيع يخصم والاستلام يضيف.')}</div>
          </aside>
          <main className="min-w-0 flex-1 p-4 md:p-6">
            <div className="-mx-1 mb-4 flex gap-2 overflow-x-auto px-1 md:hidden">
              {NAV[role].map(n => <button key={n.k} onClick={() => setView(n.k)} className={`flex shrink-0 items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-medium ${navKey === n.k ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-600 ring-1 ring-zinc-200'}`}><Icon n={n.ic} s={13} />{lang === 'ar' ? n.ar : n.fr}</button>)}
            </div>
            <div key={role + view} className="fade-up"><View /></div>
          </main>
        </div>
      </div>
      <Toasts list={toasts} />
      {receipt && <ReceiptModal sale={receipt} onClose={() => setReceipt(null)} />}
    </Ctx.Provider>
  );
}


/* ───────────────────────── Connexion ───────────────────────── */
function AuthScreen({ lang, setLang }) {
  const t = (fr, ar) => lang === 'ar' ? ar : fr;
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [name, setName] = useState('');
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const authErr = m => /invalid login/i.test(m) ? t('E-mail ou mot de passe incorrect', 'البريد أو كلمة المرور غير صحيحة')
    : /already registered|already been registered/i.test(m) ? t('Cet e-mail a déjà un compte', 'هذا البريد لديه حساب بالفعل')
    : /at least|weak|short/i.test(m) ? t('Mot de passe trop court (6 caractères minimum)', 'كلمة المرور قصيرة (6 أحرف على الأقل)')
    : /confirm/i.test(m) ? t('Confirmez d’abord votre e-mail', 'أكّد بريدك أولاً') : m;
  const submit = async e => {
    e.preventDefault();
    if (!email.trim() || !pw) return;
    setBusy(true); setMsg(null);
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pw, options: { data: { full_name: name.trim() } } });
        if (error) throw error;
        if (!data.session) setMsg({ ok: true, text: t('Compte créé. Vérifiez votre e-mail pour confirmer, puis connectez-vous.', 'تم إنشاء الحساب. تحقق من بريدك للتأكيد ثم سجّل الدخول.') });
      }
    } catch (err) { setMsg({ ok: false, text: authErr(String(err.message || err)) }); }
    finally { setBusy(false); }
  };
  return (
    <div className="grid min-h-screen place-items-center p-4">
      <div className="w-full max-w-sm">
        <div className="mb-6 flex items-center justify-between">
          <div className="flex items-center gap-2.5"><div className="grid h-9 w-9 place-items-center rounded-lg bg-zinc-900 text-sm font-extrabold text-white">DJ</div><div className="leading-tight"><div className="font-semibold">Magasin</div><div className="text-[11px] text-zinc-500">{t('Site web officiel & ERP', 'الموقع الرسمي ونظام الإدارة')}</div></div></div>
          <button onClick={() => setLang(lang === 'fr' ? 'ar' : 'fr')} className="flex items-center gap-1 rounded-full bg-white px-3 py-1.5 text-xs font-semibold hover:bg-zinc-50"><Icon n="globe" s={14} />{lang === 'fr' ? 'عربي' : 'FR'}</button>
        </div>
        <Card className="p-6">
          <h1 className="text-xl font-bold tracking-tight">{mode === 'login' ? t('Connexion', 'تسجيل الدخول') : t('Créer un compte client', 'إنشاء حساب زبون')}</h1>
          <p className="mt-1 text-sm text-zinc-500">{mode === 'login' ? t('Accédez à votre espace.', 'ادخل إلى مساحتك.') : t('Gagnez des points à chaque achat.', 'اجمع النقاط مع كل عملية شراء.')}</p>
          <form onSubmit={submit} className="mt-5 space-y-3">
            {mode === 'signup' && <Field label={t('Nom complet', 'الاسم الكامل')}><Input value={name} onChange={e => setName(e.target.value)} autoComplete="name" /></Field>}
            <Field label="E-mail"><Input type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="email" required dir="ltr" /></Field>
            <Field label={t('Mot de passe', 'كلمة المرور')}><Input type="password" value={pw} onChange={e => setPw(e.target.value)} autoComplete={mode === 'login' ? 'current-password' : 'new-password'} required minLength={6} dir="ltr" /></Field>
            {msg && <div className={`rounded-xl px-3 py-2 text-xs ${msg.ok ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-700'}`}>{msg.text}</div>}
            <button type="submit" disabled={busy} className="w-full rounded-xl bg-zinc-900 py-2.5 text-sm font-semibold text-white transition hover:bg-zinc-800 disabled:opacity-50">{busy ? '…' : mode === 'login' ? t('Se connecter', 'دخول') : t('Créer mon compte', 'إنشاء حسابي')}</button>
          </form>
          <button onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setMsg(null); }} className="mt-4 w-full text-center text-xs font-medium text-zinc-600 hover:text-zinc-900">
            {mode === 'login' ? t('Pas de compte ? Créer un compte client', 'ليس لديك حساب؟ أنشئ حساب زبون') : t('Déjà un compte ? Se connecter', 'لديك حساب؟ سجّل الدخول')}
          </button>
        </Card>
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState('fr');
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, sess) => setSession(sess || null));
    return () => sub.subscription.unsubscribe();
  }, []);
  useEffect(() => { document.documentElement.lang = lang === 'ar' ? 'ar' : 'fr'; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }, [lang]);
  if (session === undefined) return <div className="grid min-h-screen place-items-center text-sm text-zinc-500">Chargement…</div>;
  if (!session) return <AuthScreen lang={lang} setLang={setLang} />;
  return <Shell key={session.user.id} session={session} lang={lang} setLang={setLang} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
